<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Bell/concierge icon mark -->
  <rect x="8" y="8" width="104" height="104" rx="20" fill="#7c4a00"/>
  <rect x="8" y="8" width="104" height="104" rx="20" fill="url(#gold)"/>
  <!-- Concierge bell -->
  <ellipse cx="60" cy="78" rx="28" ry="5" fill="#b8860b" opacity="0.9"/>
  <rect x="57" y="72" width="6" height="8" rx="2" fill="#d4a017"/>
  <path d="M36 72 Q60 40 84 72" fill="#c8960c" stroke="#b8860b" stroke-width="1.5"/>
  <!-- Lantern suggestion -->
  <rect x="56" y="48" width="8" height="12" rx="3" fill="#ffd700" opacity="0.8"/>
  <!-- Letter I serif suggestion -->
  <rect x="55" y="30" width="10" height="3" rx="1.5" fill="#ffd700"/>
  <rect x="55" y="50" width="10" height="3" rx="1.5" fill="#ffd700"/>
  <rect x="58.5" y="32" width="3" height="19" fill="#ffd700"/>
  <defs>
    <linearGradient id="gold" x1="8" y1="8" x2="112" y2="112">
      <stop offset="0%" stop-color="#c8960c"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
  </defs>
  <!-- INNKEEPER text -->
  <text x="130" y="62" font-family="Georgia, serif" font-size="38" font-weight="900"
    fill="#7c4a00" letter-spacing="2">INNKEEPER</text>
  <text x="130" y="85" font-family="Georgia, serif" font-size="13" font-weight="400"
    fill="#b8860b" letter-spacing="5">HOTEL MANAGEMENT SUITE</text>
  <!-- Decorative lines -->
  <line x1="130" y1="93" x2="175" y2="93" stroke="#b8860b" stroke-width="1"/>
  <line x1="315" y1="93" x2="360" y2="93" stroke="#b8860b" stroke-width="1"/>
</svg>
